<!DOCTYPE html>
<html>
<head>
  <title>Bookmarker</title>
  <meta charset="UTF-8"> <title>Bookmarker</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <div class="search-container">
      <input type="text" id="search" placeholder="Search bookmarks...">
    </div>
    <div class="buttons-container">
      <button id="add-bookmark" class="btn btn-primary">Bookmark This Page</button>
      <div class="track-container">
        <input type="checkbox" id="track-domain">
        <label for="track-domain">Track this domain</label>
        <span id="tracking-status-icon"></span>
        <div id="track-url-container" class="hidden">
          <input type="text" id="track-url" placeholder="e.g., sample.com/book">
        </div>
      </div>
      <button id="clear-bookmarks" class="btn btn-danger">Clear All</button>
    </div>
    <ul id="bookmarks-list"></ul>
    <div id="notification" class="hidden"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
